        '204':
          description: No response body
components:
  schemas:
    Budget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        category:
          $ref: '#/components/schemas/BudgetCategoryEnum'
        limit_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        period:
          $ref: '#/components/schemas/PeriodEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
        spent_amount:
          type: number
          format: double
          readOnly: true
        remaining_amount:
          type: number
          format: double
          readOnly: true
        percentage_used:
          type: number
          format: double
          readOnly: true
        budget_status:
          type: string
          readOnly: true
      required:
      - budget_status
      - category
      - created_at
      - end_date
      - id
      - limit_amount
      - name
      - percentage_used
      - period
      - remaining_amount
      - spent_amount
      - start_date
    BudgetCategoryEnum:
      enum:
      - food
      - transportation
      - housing
      - utilities
      - healthcare
      - education
      - entertainment
      - shopping
      - business
      - other
      type: string
      description: |-
        * `food` - Food
        * `transportation` - Transportation
        * `housing` - Housing
        * `utilities` - Utilities
        * `healthcare` - Healthcare
        * `education` - Education
        * `entertainment` - Entertainment
        * `shopping` - Shopping
        * `business` - Business
        * `other` - Other
    CategorySpending:
      type: object
      properties:
        category:
          type: string
        total_spent:
          type: string
        transaction_count:
          type: integer
        percentage:
          type: string
      required:
      - category
      - percentage
      - total_spent
      - transaction_count
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        event_date:
          type: string
          format: date
        total_spent:
          type: number
          format: double
          readOnly: true
        remaining_budget:
          type: number
          format: double
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget
      - created_at
      - event_date
      - id
      - name
      - remaining_budget
      - total_spent
      - updated_at
    LargestExpense:
      type: object
      properties:
        title:
          type: string
        amount:
          type: string
        category:
          type: string
        date:
          type: string
      required:
      - amount
      - category
      - date
      - title
    PatchedBudget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        category:
          $ref: '#/components/schemas/BudgetCategoryEnum'
        limit_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        period:
          $ref: '#/components/schemas/PeriodEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
        spent_amount:
          type: number
          format: double
          readOnly: true
        remaining_amount:
          type: number
          format: double
          readOnly: true
        percentage_used:
          type: number
          format: double
          readOnly: true
        budget_status:
          type: string
          readOnly: true
    PatchedEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        event_date:
          type: string
          format: date
        total_spent:
          type: number
          format: double
          readOnly: true
        remaining_budget:
          type: number
          format: double
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTransaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        category:
          $ref: '#/components/schemas/TransactionCategoryEnum'
        description:
          type: string
        date:
          type: string
          format: date
        event:
          type: integer
          nullable: true
    PeriodEnum:
      enum:
      - weekly
      - monthly
      - yearly
      - custom
      type: string
      description: |-
        * `weekly` - Weekly
        * `monthly` - Monthly
        * `yearly` - Yearly
        * `custom` - Custom
    PreviousPeriod:
      type: object
      properties:
        start_date:
          type: string
        end_date:
          type: string
        total_spent:
          type: string
      required:
      - end_date
      - start_date
      - total_spent
    SpendingAnalysis:
      type: object
      properties:
        period:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        total_spent:
          type: string
        transaction_count:
          type: integer
        average_daily_spending:
          type: string
        largest_expense:
          allOf:
          - $ref: '#/components/schemas/LargestExpense'
          nullable: true
        highest_spending_category:
          type: string
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategorySpending'
        weekly_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/WeeklySpending'
        previous_period:
          $ref: '#/components/schemas/PreviousPeriod'
        spending_change:
          type: string
        percentage_change:
          type: string
          nullable: true
        spending_trend:
          type: string
      required:
      - average_daily_spending
      - categories
      - end_date
      - highest_spending_category
      - largest_expense
      - percentage_change
      - period
      - previous_period
      - spending_change
      - spending_trend
      - start_date
      - total_spent
      - transaction_count
      - weekly_breakdown
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        category:
          $ref: '#/components/schemas/TransactionCategoryEnum'
        description:
          type: string
        date:
          type: string
          format: date
        event:
          type: integer
          nullable: true
      required:
      - amount
      - category
      - date
      - id
      - title
      - transaction_type
    TransactionCategoryEnum:
      enum:
      - food
      - transportation
      - housing
      - utilities
      - healthcare
      - education
      - entertainment
      - shopping
      - salary
      - business
      - other
      type: string
      description: |-
        * `food` - Food
        * `transportation` - Transportation
        * `housing` - Housing
        * `utilities` - Utilities
        * `healthcare` - Healthcare
        * `education` - Education
        * `entertainment` - Entertainment
        * `shopping` - Shopping
        * `salary` - Salary
        * `business` - Business
        * `other` - Other
    TransactionTypeEnum:
      enum:
      - income
      - expense
      type: string
      description: |-
        * `income` - Income
        * `expense` - Expense
    UserProfile:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - username
    UserRegistration:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
        password2:
          type: string
          writeOnly: true
      required:
      - email
      - password
      - password2
      - username
    WeeklySpending:
      type: object
      properties:
        week:
          type: string
        total_spent:
          type: string
      required:
      - total_spent
      - week
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
